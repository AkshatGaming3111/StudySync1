<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Core Brand Gradient (Suite Cyan & Indigo) -->
    <linearGradient id="suiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Accent Orbit Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glow Effect Filter -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="sparkleRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Container Squircle with Glowing Border -->
  <rect x="20" y="20" width="472" height="472" rx="115" fill="url(#bgGrad)" stroke="url(#suiteGrad)" stroke-width="12" />

  <!-- Synchronous Orbital Halo Rings (Representing Suite Connectivity) -->
  <ellipse cx="256" cy="256" rx="200" ry="105" fill="none" stroke="url(#orbitGrad)" stroke-width="5" stroke-dasharray="14 10" transform="rotate(-28 256 256)" opacity="0.6" />
  <ellipse cx="256" cy="256" rx="200" ry="105" fill="none" stroke="url(#suiteGrad)" stroke-width="5" stroke-dasharray="14 10" transform="rotate(28 256 256)" opacity="0.6" />

  <!-- Node Dots along the orbits -->
  <circle cx="100" cy="180" r="9" fill="#38bdf8" filter="url(#glowEffect)" />
  <circle cx="412" cy="332" r="9" fill="#10b981" filter="url(#glowEffect)" />
  <circle cx="120" cy="340" r="8" fill="#a855f7" filter="url(#glowEffect)" />
  <circle cx="392" cy="172" r="8" fill="#f59e0b" filter="url(#glowEffect)" />

  <!-- Dual Wings / Open Knowledge Shield -->
  <path d="M 120 320 C 180 340, 240 325, 256 290 C 272 325, 332 340, 392 320 C 370 250, 310 220, 256 220 C 202 220, 142 250, 120 320 Z" 
        fill="none" stroke="url(#suiteGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" />

  <!-- Stylized Academic Graduation Cap -->
  <!-- Cap Rhombus Diamond Peak -->
  <path d="M 256 110 L 430 190 L 256 270 L 82 190 Z" fill="url(#suiteGrad)" filter="url(#glowEffect)" />

  <!-- Cap Crown Lower Arc -->
  <path d="M 160 235 V 315 C 160 360 202 385 256 385 C 310 385 352 360 352 315 V 235" 
        fill="none" stroke="#e0e7ff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Hanging Golden Tassel -->
  <path d="M 405 200 V 305" stroke="#f59e0b" stroke-width="10" stroke-linecap="round" />
  <circle cx="405" cy="315" r="14" fill="#f59e0b" filter="url(#glowEffect)" />

  <!-- Neural Core & AI Intelligence Starburst -->
  <!-- Central Quad-Point AI Sparkle Star -->
  <path d="M 256 145 L 274 195 L 324 213 L 274 231 L 256 281 L 238 231 L 188 213 L 238 195 Z" fill="#ffffff" filter="url(#glowEffect)" />
  
  <!-- Mini AI Sparkle 1 -->
  <path d="M 355 125 L 361 141 L 377 147 L 361 153 L 355 169 L 349 153 L 333 147 L 349 141 Z" fill="#38bdf8" />

  <!-- Mini AI Sparkle 2 -->
  <path d="M 155 130 L 160 144 L 174 149 L 160 154 L 155 168 L 150 154 L 136 149 L 150 144 Z" fill="#10b981" />
</svg>
