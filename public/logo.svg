<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 140" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="logoSuiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Mark (Scaled down squircle) -->
  <g transform="translate(10, 10) scale(0.234)">
    <rect x="20" y="20" width="472" height="472" rx="115" fill="url(#logoBgGrad)" stroke="url(#logoSuiteGrad)" stroke-width="14" />
    <ellipse cx="256" cy="256" rx="200" ry="105" fill="none" stroke="#38bdf8" stroke-width="6" stroke-dasharray="14 10" transform="rotate(-28 256 256)" opacity="0.6" />
    <ellipse cx="256" cy="256" rx="200" ry="105" fill="none" stroke="#a855f7" stroke-width="6" stroke-dasharray="14 10" transform="rotate(28 256 256)" opacity="0.6" />
    
    <!-- Cap & Wings -->
    <path d="M 256 110 L 430 190 L 256 270 L 82 190 Z" fill="url(#logoSuiteGrad)" filter="url(#logoGlow)" />
    <path d="M 160 235 V 315 C 160 360 202 385 256 385 C 310 385 352 360 352 315 V 235" 
          fill="none" stroke="#e0e7ff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 405 200 V 305" stroke="#f59e0b" stroke-width="10" stroke-linecap="round" />
    <circle cx="405" cy="315" r="14" fill="#f59e0b" />
    <!-- AI Sparkle -->
    <path d="M 256 145 L 274 195 L 324 213 L 274 231 L 256 281 L 238 231 L 188 213 L 238 195 Z" fill="#ffffff" filter="url(#logoGlow)" />
  </g>

  <!-- Typography: StudySync -->
  <text x="148" y="72" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Study<tspan fill="#38bdf8">Sync</tspan>
  </text>

  <!-- AI Badge -->
  <rect x="368" y="40" width="58" height="32" rx="8" fill="url(#logoSuiteGrad)" opacity="0.9" />
  <text x="397" y="62" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">AI</text>

  <!-- Subtitle Tagline: Educational Suite -->
  <text x="150" y="105" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#94a3b8" letter-spacing="3.2">
    EDUCATIONAL SUITE
  </text>

  <!-- Dual dots linking the two platforms -->
  <circle cx="440" cy="100" r="4" fill="#38bdf8" />
  <text x="452" y="104" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#38bdf8">Planner</text>
  <circle cx="515" cy="100" r="3" fill="#64748b" />
  <circle cx="530" cy="100" r="4" fill="#a855f7" />
  <text x="542" y="104" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#a855f7">Classroom</text>
</svg>
